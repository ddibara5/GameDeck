<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>GameDeck</title>
    <meta name="description" content="Your personal video-game library, activity, and AI game picks." />

    <!-- Supabase serves the very first request of a cold start (the library), so
         the DNS lookup and TLS handshake are on the critical path before anything
         can render from the network. crossorigin IS required here and must not be
         copied from the image hints below: this origin is reached by fetch() with
         CORS, and a preconnect whose crossorigin does not match the eventual
         request opens a second connection instead of reusing the warmed one. -->
    <link rel="preconnect" href="https://eiskobjlvxzwvucgpenk.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://eiskobjlvxzwvucgpenk.supabase.co" />

    <!-- Warm the connection to the image hosts before the first cover renders.
         wsrv.nl is the primary (resized WebP CDN); images.igdb.com is the source +
         fallback. No crossorigin: <img> loads here are non-CORS, so preconnect must match. -->
    <link rel="preconnect" href="https://wsrv.nl" />
    <link rel="dns-prefetch" href="https://wsrv.nl" />
    <link rel="preconnect" href="https://images.igdb.com" />
    <link rel="dns-prefetch" href="https://images.igdb.com" />

    <!-- Apply the saved theme before first paint to avoid a flash of the wrong mode. -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem('gamedeck_theme_v1')
          var t =
            v === 'light' || v === 'dark'
              ? v
              : v === 'system'
                ? window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                  ? 'light'
                  : 'dark'
                : 'dark'
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>

    <meta name="theme-color" content="#1a1917" />
    <meta name="theme-color" content="#1a1917" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#efe8dd" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GameDeck" />

    <!-- Home-screen icon: the porcelain tile in BOTH appearances. The ember mark
         reads with far more contrast on porcelain than on graphite, and iOS draws
         the home screen over the user's wallpaper rather than over the app's own
         background, so a dark tile was not buying the match it looked like it was.
         The manifest points at the same light art.

         The .v2. in these names is load-bearing. iOS caches a home-screen icon
         against its URL and keeps it well past any HTTP header, so redrawing a file
         in place never reaches a phone that has already added the app. Bump
         ICON_VERSION in scripts/gen-icons.cjs and these names together; the
         generator fails the build if they ever disagree. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180-light-v4.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167-light-v4.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152-light-v4.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-120-light-v4.png" />
    <!-- Precomposed alias: older iOS looks for this name first and does not fall
         back to the plain one if it is absent. Same file, both names linked. -->
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/icons/icon-180-light-v4.png" />

    <link rel="icon" type="image/svg+xml" href="/icons/icon-v4.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32-v4.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16-v4.png" />
    <!-- Versioned for the same reason the icons are: the OLD url is precached in the
         service worker's APP_SHELL, so a phone kept reading a stale manifest listing
         pre-v2 icon names. iOS reads the MANIFEST for the home-screen icon, so that
         stale copy outranked every apple-touch-icon above. -->
    <link rel="manifest" href="/manifest-v4.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
