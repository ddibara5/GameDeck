<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>GameDeck</title>
    <meta name="description" content="Your personal video-game library, activity, and AI game picks." />

    <!-- Warm the connection to IGDB's image host before the first cover renders.
         No crossorigin: <img> loads here are non-CORS, so the preconnect must match. -->
    <link rel="preconnect" href="https://images.igdb.com" />
    <link rel="dns-prefetch" href="https://images.igdb.com" />

    <!-- Apply the saved theme before first paint to avoid a flash of the wrong mode. -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem('gamedeck_theme_v1')
          var t =
            v === 'light' || v === 'dark'
              ? v
              : v === 'system'
                ? window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                  ? 'light'
                  : 'dark'
                : 'dark'
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>

    <meta name="theme-color" content="#1a1917" />
    <meta name="theme-color" content="#1a1917" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#efe8dd" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GameDeck" />

    <!-- Home-screen icons: dark (default) + light-mode variants -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-120.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180-light.png" media="(prefers-color-scheme: light)" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167-light.png" media="(prefers-color-scheme: light)" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152-light.png" media="(prefers-color-scheme: light)" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-120-light.png" media="(prefers-color-scheme: light)" />

    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
