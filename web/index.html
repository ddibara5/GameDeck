<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>GameDeck</title>
    <meta name="description" content="Your personal video-game library, activity, and AI game picks." />

    <!-- Apply the saved theme before first paint to avoid a flash of the wrong mode. -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem('gamedeck_theme_v1')
          var t =
            v === 'light' || v === 'dark'
              ? v
              : v === 'system'
                ? window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                  ? 'light'
                  : 'dark'
                : 'dark'
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>

    <meta name="theme-color" content="#1a1917" />
    <meta name="theme-color" content="#1a1917" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#efe8dd" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <!-- iOS PWA support -->
